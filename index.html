<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0;
    }

    #estado {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 82%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Sensei AI</h1>
  <p>🎹 Música • 📚 Estudio • 🧠 Aprendizaje</p>
  <div id="estado">⏳ Preparando mi cerebro...</div>
</header>

<div id="chat">

  <div class="mensaje sensei">
    ¡Hola! 👋 Soy Sensei AI.
    Estoy preparando mi cerebro. La primera carga puede tardar.
  </div>

</div>

<div class="entrada">

  <input
    id="mensaje"
    type="text"
    placeholder="Escribe tu pregunta..."
    disabled
    autocomplete="off"
  >

  <button id="enviar" disabled>
    Enviar
  </button>

</div>


<script type="module">

import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers";


let modelo = null;
let generando = false;


const chat =
  document.getElementById("chat");

const input =
  document.getElementById("mensaje");

const boton =
  document.getElementById("enviar");

const estado =
  document.getElementById("estado");


/* ==========================================
   MOSTRAR MENSAJES
========================================== */

function agregarMensaje(texto, tipo) {

  const div =
    document.createElement("div");

  div.className =
    "mensaje " + tipo;

  div.textContent =
    texto;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;
}


/* ==========================================
   LIMPIAR RESPUESTA
========================================== */

function limpiarRespuesta(texto) {

  if (!texto) {
    return "";
  }

  let respuesta =
    texto.trim();


  /* Quitar el prompt generado */

  if (respuesta.includes("Sensei AI:")) {

    respuesta =
      respuesta.substring(
        respuesta.lastIndexOf("Sensei AI:") +
        "Sensei AI:".length
      );
  }


  /* Quitar etiquetas */

  respuesta =
    respuesta
      .replace(/^Answer:\s*/i, "")
      .replace(/^Response:\s*/i, "")
      .replace(/^Respuesta:\s*/i, "")
      .replace(/^Assistant:\s*/i, "")
      .replace(/^Usuario:\s*/i, "")
      .replace(/^User:\s*/i, "")
      .replace(/<\|endoftext\|>/gi, "")
      .trim();


  /* Cortar si el modelo vuelve a empezar
     una nueva pregunta */

  const cortes = [
    "\nUsuario:",
    "\nUser:",
    "\nPregunta:",
    "\nRespuesta:",
    "\nAnswer:",
    "\nAssistant:"
  ];


  for (const corte of cortes) {

    const posicion =
      respuesta.indexOf(corte);

    if (posicion !== -1) {

      respuesta =
        respuesta
          .substring(0, posicion)
          .trim();
    }
  }


  return respuesta;
}


/* ==========================================
   DETECTOR DE RESPUESTAS MALAS
========================================== */

function respuestaDefectuosa(texto) {

  if (!texto) {
    return true;
  }


  const respuesta =
    texto.trim();


  /* Demasiado corta */

  if (respuesta.length < 2) {
    return true;
  }


  /* Demasiado larga */

  if (respuesta.length > 650) {
    return true;
  }


  const palabras =
    respuesta.split(/\s+/);


  /* Demasiadas palabras */

  if (palabras.length > 100) {
    return true;
  }


  /* ========================================
     CARACTERES EXTRAÑOS
  ======================================== */

  const caracteresExtranos =
    respuesta.match(/[�]/g);

  if (
    caracteresExtranos &&
    caracteresExtranos.length >= 1
  ) {
    return true;
  }


  /* ========================================
     REPETICIÓN DE PALABRAS
  ======================================== */

  let repetidas = 0;

  for (
    let i = 1;
    i < palabras.length;
    i++
  ) {

    const actual =
      palabras[i]
        .toLowerCase()
        .replace(/[.,!?;:]/g, "");

    const anterior =
      palabras[i - 1]
        .toLowerCase()
        .replace(/[.,!?;:]/g, "");

    if (
      actual &&
      actual === anterior
    ) {
      repetidas++;
    }
  }


  if (repetidas >= 2) {
    return true;
  }


  /* ========================================
     FRASES REPETIDAS
  ======================================== */

  const normalizada =
    respuesta
      .toLowerCase()
      .replace(/\s+/g, " ");


  const palabrasCortas =
    normalizada.split(" ");


  for (
    let i = 0;
    i < palabrasCortas.length - 4;
    i++
  ) {

    const frase =
      palabrasCortas
        .slice(i, i + 4)
        .join(" ");


    let apariciones = 0;
    let posicion = 0;


    while (
      (posicion =
        normalizada.indexOf(
          frase,
          posicion
        )) !== -1
    ) {

      apariciones++;

      posicion +=
        frase.length;
    }


    if (apariciones >= 3) {
      return true;
    }
  }


  /* ========================================
     DEMASIADOS NÚMEROS
  ======================================== */

  const numeros =
    respuesta.match(/\d/g);


  if (
    numeros &&
    numeros.length > 8
  ) {
    return true;
  }


  /* ========================================
     NÚMEROS PEGADOS SIN SENTIDO
  ======================================== */

  if (
    /\d{6,}/.test(respuesta)
  ) {
    return true;
  }


  /* ========================================
     MEZCLA SOSPECHOSA DE IDIOMAS
  ======================================== */

  const palabrasIngles =
    [
      "answer",
      "response",
      "immigrant",
      "character",
      "characters",
      "question",
      "example",
      "the",
      "this",
      "that",
      "please",
      "because",
      "however"
    ];


  let inglesDetectado = 0;


  for (
    const palabra of palabrasIngles
  ) {

    const expresion =
      new RegExp(
        "\\b" + palabra + "\\b",
        "i"
      );

    if (
      expresion.test(respuesta)
    ) {
      inglesDetectado++;
    }
  }


  if (inglesDetectado >= 2) {
    return true;
  }


  /* ========================================
     PALABRAS DEL PROMPT
  ======================================== */

  const basura =
    [
      "usuario:",
      "user:",
      "answer:",
      "response:",
      "assistant:",
      "respuesta de sensei",
      "última resposta:",
      "immigrante:"
    ];


  const minusculas =
    respuesta.toLowerCase();


  for (
    const palabra of basura
  ) {

    if (
      minusculas.includes(palabra)
    ) {
      return true;
    }
  }


  /* ========================================
     MUCHOS SÍMBOLOS
  ======================================== */

  const simbolos =
    respuesta.match(
      /[^a-záéíóúüñA-ZÁÉÍÓÚÜÑ0-9\s.,!?¿¡:;'"()\-+*/%=]/g
    );


  if (
    simbolos &&
    simbolos.length > 6
  ) {
    return true;
  }


  /* ========================================
     TEXTO CON MUCHAS PALABRAS RARAS
  ======================================== */

  const letras =
    respuesta.match(
      /[a-záéíóúüñ]+/gi
    );


  if (
    letras &&
    letras.length >= 8
  ) {

    let palabrasMuyLargas = 0;

    for (
      const palabra of letras
    ) {

      if (
        palabra.length > 18
      ) {
        palabrasMuyLargas++;
      }
    }


    if (palabrasMuyLargas >= 2) {
      return true;
    }
  }


  /* ========================================
     FRASES QUE PARECEN TEXTO GENERADO
  ======================================== */

  if (
    /1234567890/.test(respuesta)
  ) {
    return true;
  }


  if (
    /qwerty/i.test(respuesta)
  ) {
    return true;
  }


  return false;
}


/* ==========================================
   CARGAR INTELIGENCIA ARTIFICIAL
========================================== */

async function prepararIA() {

  try {

    estado.textContent =
      "🧠 Descargando el cerebro de Sensei AI...";


    modelo =
      await pipeline(
        "text-generation",
        "HuggingFaceTB/SmolLM2-135M-Instruct"
      );


    estado.textContent =
      "🟢 Sensei AI está listo";


    input.disabled =
      false;

    boton.disabled =
      false;

    input.focus();


  } catch (error) {

    console.error(error);


    estado.textContent =
      "❌ No se pudo cargar el modelo";


    agregarMensaje(
      "No pude cargar mi inteligencia artificial. Recarga la página e inténtalo nuevamente.",
      "sensei"
    );
  }
}


/* ==========================================
   ENVIAR PREGUNTA
========================================== */

async function enviar() {

  const texto =
    input.value.trim();


  if (
    !texto ||
    !modelo ||
    generando
  ) {
    return;
  }


  generando =
    true;


  agregarMensaje(
    texto,
    "usuario"
  );


  input.value =
    "";


  input.disabled =
    true;

  boton.disabled =
    true;


  const respuestaDiv =
    agregarMensaje(
      "🧠 Pensando...",
      "sensei"
    );


  const prompt =
`Eres Sensei AI.

Eres un asistente educativo que responde EN ESPAÑOL.

REGLAS:
- Responde directamente.
- Usa español claro.
- No inventes información.
- No repitas palabras.
- No repitas frases.
- No escribas números aleatorios.
- No escribas palabras sin sentido.
- No mezcles idiomas.
- No escribas "Answer".
- No escribas "Response".
- No escribas "Usuario".
- No repitas la pregunta.
- Mantén la respuesta breve.
- Si no sabes algo, dilo claramente.
- Ayuda especialmente con música, teclado, acordes, audio, teoría musical y estudio.

Pregunta:
${texto}

Respuesta:`;


  try {

    const resultado =
      await modelo(
        prompt,
        {
          max_new_tokens: 55,

          temperature: 0.1,

          do_sample: true,

          repetition_penalty: 1.4,

          no_repeat_ngram_size: 4
        }
      );


    let respuesta =
      resultado?.[0]?.generated_text || "";


    respuesta =
      limpiarRespuesta(
        respuesta
      );


    /* ======================================
       FILTRO FINAL
    ====================================== */

    if (
      respuestaDefectuosa(
        respuesta
      )
    ) {

      respuesta =
        "🤔 No pude generar una respuesta confiable. " +
        "Mi modelo se confundió esta vez. " +
        "Intenta hacer la pregunta de otra manera.";
    }


    respuestaDiv.textContent =
      respuesta;


  } catch (error) {

    console.error(error);


    respuestaDiv.textContent =
      "❌ Ocurrió un problema al generar la respuesta.";
  }


  input.disabled =
    false;

  boton.disabled =
    false;

  generando =
    false;


  input.focus();


  chat.scrollTop =
    chat.scrollHeight;
}


/* ==========================================
   ENTER PARA ENVIAR
========================================== */

boton.addEventListener(
  "click",
  enviar
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      enviar();
    }
  }
);


/* ==========================================
   INICIAR
========================================== */

prepararIA();

</script>

</body>
</html>
