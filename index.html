<html lang="es">

  <title>Sensei AI</title>

    body {

    }

    header {

      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0;
    }

    #estado {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;

    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;

    }

    .usuario {

    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

========================================== */

function guardarMemoria() {

  try {

    localStorage.setItem(
      CLAVE_MEMORIA,
      JSON.stringify(memoria)
    );

  } catch (error) {

    console.error(
      "No se pudo guardar la memoria:",
      error
    );
  }
}


/* ==========================================
   CARGAR MEMORIA
========================================== */

function cargarMemoria() {

  try {

    const guardada =
      localStorage.getItem(
        CLAVE_MEMORIA
      );


    if (guardada) {

      const datos =
        JSON.parse(guardada);


      if (Array.isArray(datos)) {

        memoria = datos;
      }
    }

  } catch (error) {

    console.error(
      "No se pudo cargar la memoria:",
      error
    );

    memoria = [];
  }
}
