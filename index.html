<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    #estado {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Sensei AI</h1>
  <p>🎹 Música • 📚 Estudio • 🧠 Aprendizaje</p>
  <div id="estado">⏳ Preparando mi cerebro...</div>
</header>

<div id="chat">
  <div class="mensaje sensei">
    ¡Hola! 👋 Soy Sensei AI.
    Estoy preparando mi cerebro. La primera carga puede tardar.
  </div>
</div>

<div class="entrada">
  <input id="mensaje" placeholder="Escribe tu pregunta..." disabled>
  <button id="enviar" disabled>Enviar</button>
</div>

<script type="module">

import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

let modelo = null;

const chat = document.getElementById("chat");
const input = document.getElementById("mensaje");
const boton = document.getElementById("enviar");
const estado = document.getElementById("estado");

function agregarMensaje(texto, tipo) {

  const div = document.createElement("div");

  div.className = "mensaje " + tipo;

  div.textContent = texto;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function prepararIA() {

  try {

    estado.textContent =
      "🧠 Descargando el cerebro de Sensei AI...";

    modelo = await pipeline(
      "text-generation",
      "HuggingFaceTB/SmolLM2-135M-Instruct"
    );

    estado.textContent =
      "🟢 Sensei AI está listo";

    input.disabled = false;
    boton.disabled = false;

    input.focus();

  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No se pudo cargar el modelo";

    agregarMensaje(
      "No pude cargar mi modelo de inteligencia artificial. Intenta recargar la página.",
      "sensei"
    );
  }
}

async function enviar() {

  const texto = input.value.trim();

  if (!texto || !modelo) return;

  agregarMensaje(texto, "usuario");

  input.value = "";

  input.disabled = true;
  boton.disabled = true;

  const respuestaDiv =
    agregarMensaje("🧠 Pensando...", "sensei");

  const prompt =
`Eres Sensei AI, un asistente educativo.

IMPORTANTE:
- Responde SIEMPRE en español.
- Responde únicamente a la pregunta del usuario.
- Sé claro, breve y útil.
- No repitas frases.
- No cambies de tema.
- No escribas "Answer:".
- No escribas "Response:".
- No inventes información.
- Si no sabes algo, dilo.
- Ayuda especialmente con música, teclado, audio y estudio.

Usuario:
${texto}

Sensei AI:`;

  try {

    const resultado = await modelo(prompt, {

      max_new_tokens: 100,

      temperature: 0.2,

      do_sample: true,

      repetition_penalty: 1.3,

      no_repeat_ngram_size: 3

    });

    let respuesta =
      resultado[0]?.generated_text || "";

    if (respuesta.includes("Sensei AI:")) {

      respuesta =
        respuesta.substring(
          respuesta.lastIndexOf("Sensei AI:") +
          "Sensei AI:".length
        );
    }

    respuesta =
      respuesta.trim();

    respuesta =
      respuesta
        .replace(/^Answer:\s*/i, "")
        .replace(/^Response:\s*/i, "")
        .replace(/^Respuesta:\s*/i, "")
        .trim();

    if (!respuesta) {

      respuesta =
        "No pude generar una respuesta. Intenta preguntarlo de otra manera.";

    }

    respuestaDiv.textContent =
      respuesta;

  } catch (error) {

    console.error(error);

    respuestaDiv.textContent =
      "❌ Ocurrió un problema al generar la respuesta.";

  }

  input.disabled = false;
  boton.disabled = false;

  input.focus();

  chat.scrollTop = chat.scrollHeight;
}

boton.addEventListener("click", enviar);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    enviar();

  }

});

prepararIA();

</script>

</body>
</html>
