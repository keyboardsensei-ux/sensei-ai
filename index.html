<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    #estado {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Sensei AI</h1>
  <p>🎹 Música • 📚 Estudio • 🧠 Aprendizaje</p>
  <div id="estado">⏳ Preparando mi cerebro...</div>
</header>

<div id="chat">
  <div class="mensaje sensei">
    ¡Hola! 👋 Soy Sensei AI.
    Estoy preparando mi cerebro. La primera carga puede tardar.
  </div>
</div>

<div class="entrada">
  <input
    id="mensaje"
    placeholder="Escribe tu pregunta..."
    disabled
  >

  <button id="enviar" disabled>
    Enviar
  </button>
</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

let modelo = null;
let generando = false;

const chat = document.getElementById("chat");
const input = document.getElementById("mensaje");
const boton = document.getElementById("enviar");
const estado = document.getElementById("estado");

function agregarMensaje(texto, tipo) {

  const div = document.createElement("div");

  div.className = "mensaje " + tipo;

  div.textContent = texto;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}


/* ================================
   FILTRO DE RESPUESTAS DEFECTUOSAS
================================ */

function respuestaDefectuosa(texto) {

  if (!texto || texto.length < 2) {
    return true;
  }

  const palabras = texto
    .trim()
    .split(/\s+/);

  /* Demasiadas palabras para un modelo
     tan pequeño suelen indicar que se perdió */
  if (palabras.length > 120) {
    return true;
  }

  /* Caracteres extraños */
  const caracteresRaros =
    (texto.match(/[�]/g) || []).length;

  if (caracteresRaros >= 2) {
    return true;
  }

  /* Muchas repeticiones consecutivas */
  let repeticiones = 0;

  for (let i = 1; i < palabras.length; i++) {

    if (
      palabras[i].toLowerCase() ===
      palabras[i - 1].toLowerCase()
    ) {
      repeticiones++;
    }
  }

  if (repeticiones >= 3) {
    return true;
  }

  /* Frases que indican que el modelo
     comenzó a repetir el prompt */
  const basura = [
    "answer:",
    "response:",
    "usuario:",
    "user:",
    "assistant:",
    "respuesta:",
    "immigrante:",
    "última resposta:"
  ];

  const minusculas = texto.toLowerCase();

  for (const palabra of basura) {

    if (minusculas.includes(palabra)) {
      return true;
    }
  }

  /* Demasiados símbolos seguidos */
  if (/[^a-záéíóúüñ0-9\s.,!?¿¡:;'"()\-/%+*=]/gi.test(texto)) {

    const raros =
      texto.match(/[^a-záéíóúüñ0-9\s.,!?¿¡:;'"()\-/%+*=]/gi);

    if (raros && raros.length > 5) {
      return true;
    }
  }

  return false;
}


/* ================================
   LIMPIAR RESPUESTA
================================ */

function limpiarRespuesta(texto) {

  let respuesta = texto.trim();

  if (respuesta.includes("Sensei AI:")) {

    respuesta =
      respuesta.substring(
        respuesta.lastIndexOf("Sensei AI:") +
        "Sensei AI:".length
      );
  }

  respuesta = respuesta
    .replace(/^Answer:\s*/i, "")
    .replace(/^Response:\s*/i, "")
    .replace(/^Respuesta:\s*/i, "")
    .replace(/^Sensei AI:\s*/i, "")
    .replace(/<\|endoftext\|>/gi, "")
    .trim();

  /* Si vuelve a empezar a escribir el prompt,
     cortamos ahí */

  const cortes = [
    "\nUsuario:",
    "\nUser:",
    "\nPregunta:",
    "\nRespuesta:",
    "\nAnswer:"
  ];

  for (const corte of cortes) {

    const posicion =
      respuesta.indexOf(corte);

    if (posicion !== -1) {

      respuesta =
        respuesta.substring(0, posicion).trim();
    }
  }

  return respuesta;
}


/* ================================
   CARGAR MODELO
================================ */

async function prepararIA() {

  try {

    estado.textContent =
      "🧠 Descargando el cerebro de Sensei AI...";

    modelo = await pipeline(
      "text-generation",
      "HuggingFaceTB/SmolLM2-135M-Instruct"
    );

    estado.textContent =
      "🟢 Sensei AI está listo";

    input.disabled = false;
    boton.disabled = false;

    input.focus();

  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No se pudo cargar el modelo";

    agregarMensaje(
      "No pude cargar mi inteligencia artificial. Recarga la página e inténtalo otra vez.",
      "sensei"
    );
  }
}


/* ================================
   GENERAR RESPUESTA
================================ */

async function enviar() {

  const texto = input.value.trim();

  if (!texto || !modelo || generando) {
    return;
  }

  generando = true;

  agregarMensaje(texto, "usuario");

  input.value = "";

  input.disabled = true;
  boton.disabled = true;

  const respuestaDiv =
    agregarMensaje(
      "🧠 Pensando...",
      "sensei"
    );

  const prompt =
`Eres Sensei AI, un asistente educativo en español.

REGLAS IMPORTANTES:
1. Responde únicamente en español.
2. Responde directamente a la pregunta.
3. Sé claro y preciso.
4. No inventes datos.
5. No repitas palabras ni frases.
6. No cambies de tema.
7. No escribas la pregunta del usuario.
8. No escribas "Answer", "Response" ni "Usuario".
9. Si no sabes la respuesta, dilo claramente.
10. Para música, explica acordes, escalas, teclado y teoría de forma sencilla.

Pregunta del usuario:
${texto}

Respuesta de Sensei AI:`;


  try {

    const resultado =
      await modelo(prompt, {

        max_new_tokens: 70,

        temperature: 0.15,

        do_sample: true,

        repetition_penalty: 1.35,

        no_repeat_ngram_size: 4

      });


    let respuesta =
      resultado?.[0]?.generated_text || "";


    respuesta =
      limpiarRespuesta(respuesta);


    /* ================================
       FILTRO FINAL
    ================================= */

    if (respuestaDefectuosa(respuesta)) {

      respuesta =
        "🤔 No pude generar una respuesta confiable. " +
        "Este modelo es pequeño y a veces se confunde. " +
        "Intenta hacer la pregunta de otra manera.";
    }


    respuestaDiv.textContent =
      respuesta;


  } catch (error) {

    console.error(error);

    respuestaDiv.textContent =
      "❌ No pude generar una respuesta. Inténtalo nuevamente.";

  }


  input.disabled = false;
  boton.disabled = false;

  generando = false;

  input.focus();

  chat.scrollTop =
    chat.scrollHeight;
}


/* ================================
   BOTONES
================================ */

boton.addEventListener(
  "click",
  enviar
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      enviar();
    }
  }
);


/* ================================
   INICIAR SENSEI AI
================================ */

prepararIA();

</script>

</body>
</html>
