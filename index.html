<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    #estado {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Sensei AI</h1>
  <p>🎹 Música • 📚 Estudio • 🧠 Aprendizaje</p>
  <div id="estado">⏳ Preparando inteligencia artificial...</div>
</header>

<div id="chat">
  <div class="mensaje sensei">
    ¡Hola! 👋 Soy Sensei AI.
    Estoy preparando mi cerebro. La primera carga puede tardar.
  </div>
</div>

<div class="entrada">
  <input
    id="mensaje"
    placeholder="Escribe tu pregunta..."
    disabled
  >

  <button id="enviar" onclick="enviar()" disabled>
    Enviar
  </button>
</div>

<script type="module">

  import {
    pipeline
  } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

  let modelo = null;

  const chat = document.getElementById("chat");
  const input = document.getElementById("mensaje");
  const boton = document.getElementById("enviar");
  const estado = document.getElementById("estado");

  async function prepararIA() {

    try {

      estado.textContent =
        "🧠 Descargando el cerebro de Sensei AI...";

      modelo = await pipeline(
        "text-generation",
        "HuggingFaceTB/SmolLM2-135M-Instruct"
      );

      estado.textContent =
        "🟢 Sensei AI está listo";

      input.disabled = false;
      boton.disabled = false;

      input.focus();

    } catch (error) {

      console.error(error);

      estado.textContent =
        "❌ No se pudo cargar el modelo";

      chat.innerHTML += `
        <div class="mensaje sensei">
          No pude cargar mi modelo de IA.
          Puede que este Chromebook no tenga suficiente memoria
          o que la descarga haya fallado.
        </div>
      `;
    }
  }

  async function enviar() {

    const texto = input.value.trim();

    if (!texto || !modelo) return;

    chat.innerHTML += `
      <div class="mensaje usuario">
        ${texto}
      </div>
    `;

    input.value = "";

    boton.disabled = true;
    input.disabled = true;

    const mensajePensando = document.createElement("div");

    mensajePensando.className = "mensaje sensei";
    mensajePensando.textContent = "🧠 Pensando...";

    chat.appendChild(mensajePensando);

    chat.scrollTop = chat.scrollHeight;

    try {

      const prompt =
        `Eres Sensei AI, un asistente educativo experto en música, audio y estudio.

REGLAS:
- Responde SIEMPRE en español.
- No escribas "Answer:" ni "Respuesta:" al comenzar.
- Responde directamente a la pregunta.
- Sé claro y preciso.
- Si no estás seguro de un dato, dilo.
- No inventes información.

Usuario: ${texto}

Respuesta de Sensei AI:`

User: ${texto}

Sensei AI:`;

      const resultado = await modelo(prompt, {
        max_new_tokens: 150,
        temperature: 0.7,
        do_sample: true
      });

      let respuesta =
        resultado[0].generated_text;

      if (respuesta.includes("Sensei AI:")) {
        respuesta =
          respuesta.split("Sensei AI:").pop().trim();
      }

      mensajePensando.textContent =
        respuesta || "No pude generar una respuesta.";

    } catch (error) {

      console.error(error);

      mensajePensando.textContent =
        "❌ Ocurrió un problema al generar la respuesta.";

    }

    boton.disabled = false;
    input.disabled = false;

    input.focus();

    chat.scrollTop = chat.scrollHeight;
  }

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      enviar();
    }

  });

  prepararIA();

</script>

</body>
</html>
