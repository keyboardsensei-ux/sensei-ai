<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
    }

    .sensei {
      background: #374151;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: #111827;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 Sensei AI</h1>
  <p>🎹 Música • 📚 Estudio • 🧠 Aprendizaje</p>
</header>

<div id="chat">
  <div class="mensaje sensei">
    ¡Hola! 👋 Soy Sensei AI. ¿En qué puedo ayudarte?
  </div>
</div>

<div class="entrada">
  <input id="mensaje" placeholder="Escribe tu pregunta...">
  <button onclick="enviar()">Enviar</button>
</div>

<script>
function enviar() {
  const input = document.getElementById("mensaje");
  const chat = document.getElementById("chat");
  const texto = input.value.trim();

  if (!texto) return;

  chat.innerHTML += `
    <div class="mensaje usuario">${texto}</div>
  `;

  input.value = "";

  setTimeout(() => {
    chat.innerHTML += `
      <div class="mensaje sensei">
        🤖 Soy Sensei AI. Mi cerebro de inteligencia artificial se conectará en el siguiente paso.
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;
  }, 500);
}
</script> 
  document.querySelector("input").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    enviar();
  }
});
</body>
</html>
